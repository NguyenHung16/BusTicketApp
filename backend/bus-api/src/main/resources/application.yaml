spring:
  application:
    name: buss-api

  datasource:
    url: jdbc:mysql://localhost:3306/busapp_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: 16122003
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
